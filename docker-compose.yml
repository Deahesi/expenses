version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: expenses-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expenses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-expenses}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controlplane}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: