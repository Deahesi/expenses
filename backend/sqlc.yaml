version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/storage/postgres/migrations"
    queries: "internal/storage/postgres/queries"
    gen:
      go:
        package: "gen"
        out: "internal/storage/postgres/gen"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "pg_catalog.uuid"
            go_type: "github.com/google/uuid.UUID"
            
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          
          - db_type: "pg_catalog.float8"
            nullable: true
            go_type:
              type: "float64"
              pointer: true

          - db_type: "pg_catalog.float8"
            nullable: false
            go_type:
              type: "float64"

          - db_type: "pg_catalog.int4"
            nullable: false
            go_type:
              type: "int"
